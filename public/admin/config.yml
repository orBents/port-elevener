backend:
  name: github
  repo: orBents/port-elevener
  branch: main
  base_url: https://port-elevener.pages.dev
  auth_endpoint: api/auth
  site_domain: port-elevener.pages.dev
  auth_scope: repo
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: projects
    label: Obras
    label_singular: Obra
    description: "Cadastre e organize cada obra, sua capa, galeria e vídeos."
    folder: src/data/projects
    create: true
    delete: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{category}}"
    sortable_fields:
      - { field: order, label: "Ordem no site", default_sort: asc }
      - { field: title, label: "Título" }
      - { field: publishedAt, label: "Data de publicação" }
    view_filters:
      - { label: "Publicadas", field: published, pattern: true }
      - { label: "Não publicadas", field: published, pattern: false }
    view_groups:
      - { label: "Por categoria", field: category }
    fields:
      - { label: Título da obra, name: title, widget: string, hint: "Nome público do projeto." }
      - { label: Endereço da obra, name: slug, widget: string, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use letras minúsculas, números e hífens."], hint: "Não altere depois de publicar: o endereço público será atualizado." }
      - { label: Categoria, name: category, widget: relation, collection: categories, search_fields: [name, slug], value_field: slug, display_fields: [name], required: true, hint: "Escolha uma categoria. Para criar ou organizar opções, abra Categorias do menu." }
      - { label: Resumo, name: summary, widget: text, hint: "Breve apresentação exibida no cartão da obra." }
      - { label: Ordem de exibição, name: order, widget: number, value_type: int, min: 0, default: 0, hint: "Números menores aparecem primeiro." }
      - { label: Publicar no site, name: published, widget: boolean, default: false, hint: "Desative para manter a obra salva, mas fora do site público." }
      - { label: Destacar obra, name: featured, widget: boolean, default: false, hint: "Disponibiliza a obra para uma seção de destaques configurada na página inicial." }
      - { label: Data de publicação, name: publishedAt, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Imagem de capa, name: cover, widget: image, required: false, choose_url: false, hint: "Envie uma imagem. A proporção original é preservada, salvo se o recorte for ativado em Personalizar layout." }
      - label: Galeria e vídeos
        name: media
        widget: list
        required: false
        summary: "{{fields.type}}"
        label_singular: "Mídia"
        collapsed: true
        minimize_collapsed: true
        hint: "Arraste os itens para reordenar. Remover um item daqui não remove o arquivo enviado."
        types:
          - label: Imagem
            name: image
            fields:
              - { label: Arquivo de imagem, name: source, widget: image, choose_url: false, hint: "Envie ou escolha uma imagem." }
              - { label: Texto alternativo, name: alt, widget: string, required: false, hint: "Descreva a imagem para leitores de tela." }
              - { label: Legenda, name: caption, widget: string, required: false }
          - label: Vídeo do YouTube
            name: youtube
            fields:
              - { label: URL do YouTube, name: source, widget: string, pattern: ["^https?://(?:www\\.)?(youtube\\.com|youtu\\.be)/", "Use uma URL pública do YouTube." ] }
              - { label: Legenda, name: caption, widget: string, required: false }
          - label: GIF animado
            name: gif
            fields:
              - { label: Arquivo GIF, name: source, widget: image, choose_url: false, hint: "Envie um GIF animado (.gif). A animação será reproduzida automaticamente em loop." }
              - { label: Texto alternativo, name: alt, widget: string, required: false, hint: "Descreva a animação para leitores de tela." }
              - { label: Legenda, name: caption, widget: string, required: false }
          - label: Vídeo do Vimeo
            name: vimeo
            fields:
              - { label: URL do Vimeo, name: source, widget: string, pattern: ["^https?://(?:www\\.)?vimeo\\.com/", "Use uma URL pública do Vimeo." ] }
              - { label: Legenda, name: caption, widget: string, required: false }
      - { label: Descrição completa, name: body, widget: markdown, required: false }

  - name: categories
    label: Categorias do menu
    label_singular: Categoria
    description: "Categorias organizam as obras, os filtros da Home e os links do menu superior. Para preservar referências, a exclusão é desativada no painel."
    folder: src/data/categories
    create: true
    delete: false
    slug: "{{fields.slug}}"
    extension: json
    format: json
    summary: "{{name}}"
    sortable_fields:
      - { field: order, label: "Posição no menu", default_sort: asc }
      - { field: name, label: "Nome" }
    fields:
      - { label: Nome, name: name, widget: string, hint: "Nome visível para visitantes." }
      - { label: Identificador, name: slug, widget: string, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use letras minúsculas, números e hífens."], hint: "Não altere enquanto existirem obras ou seções da Home usando esta categoria." }
      - { label: Descrição curta, name: description, widget: text, required: false, hint: "Uso interno para contextualizar a categoria." }
      - label: Posição no menu
        name: order
        widget: select
        options:
          - { label: "1ª posição", value: 10 }
          - { label: "2ª posição", value: 20 }
          - { label: "3ª posição", value: 30 }
          - { label: "4ª posição", value: 40 }
          - { label: "5ª posição", value: 50 }
          - { label: "6ª posição", value: 60 }
          - { label: "7ª posição", value: 70 }
          - { label: "8ª posição", value: 80 }
          - { label: "9ª posição", value: 90 }
          - { label: "10ª posição", value: 100 }
        hint: "Escolha uma posição livre. Esta opção preserva os valores técnicos de ordem já usados pelo site."
      - { label: Exibir no menu e nos filtros, name: visible, widget: boolean, default: true, hint: "Ocultar não apaga obras vinculadas; elas continuam disponíveis no painel." }

  - name: home
    label: Página inicial
    description: "Organize as seções exibidas depois da galeria principal de obras."
    files:
      - name: home
        label: Seções da página inicial
        file: src/data/site/home.json
        fields:
          - { name: type, widget: hidden, default: home }
          - label: Seções depois da galeria principal
            name: sections
            widget: list
            required: false
            summary: "{{fields.type}} · {{fields.title}}"
            label_singular: "Seção"
            collapsed: true
            minimize_collapsed: true
            hint: "Arraste para mudar a ordem. Remover uma seção não exclui obras, imagens nem vídeos vinculados."
            types:
              - label: Galeria de artes
                name: gallery
                fields: &section_common
                  - { label: Visível, name: visible, widget: boolean, default: true }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Texto acima do título, name: eyebrow, widget: string, required: false }
                  - { label: Alinhamento, name: alignment, widget: select, options: [start, center], default: start }
                  - { label: Categorias, name: categories, widget: relation, collection: categories, search_fields: [name, slug], value_field: slug, display_fields: [name], multiple: true, required: false, hint: "Vazio mostra todas as categorias." }
                  - { label: Máximo de obras, name: limit, widget: number, value_type: int, min: 1, max: 24, default: 8 }
              - label: Projetos destacados
                name: featured
                fields:
                  - { label: Visível, name: visible, widget: boolean, default: true }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Texto acima do título, name: eyebrow, widget: string, required: false }
                  - { label: Alinhamento, name: alignment, widget: select, options: [start, center], default: start }
                  - { label: Obras selecionadas, name: projects, widget: relation, collection: projects, search_fields: [title, slug], value_field: slug, display_fields: [title], multiple: true, required: false, hint: "Vazio usa as obras marcadas como destaque." }
                  - { label: Máximo de obras, name: limit, widget: number, value_type: int, min: 1, max: 12, default: 4 }
              - label: Lista de categorias
                name: categories
                fields:
                  - { label: Visível, name: visible, widget: boolean, default: true }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Texto acima do título, name: eyebrow, widget: string, required: false }
                  - { label: Alinhamento, name: alignment, widget: select, options: [start, center], default: start }
                  - { label: Categorias, name: categories, widget: relation, collection: categories, search_fields: [name, slug], value_field: slug, display_fields: [name], multiple: true, required: false, hint: "Vazio mostra todas as categorias visíveis." }
              - label: Texto editorial
                name: editorial
                fields:
                  - { label: Visível, name: visible, widget: boolean, default: true }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Texto acima do título, name: eyebrow, widget: string, required: false }
                  - { label: Alinhamento, name: alignment, widget: select, options: [start, center], default: start }
                  - { label: Texto, name: content, widget: text }
                  - { label: Fundo, name: tone, widget: select, options: [plain, surface], default: plain }
              - label: Imagem
                name: image
                fields:
                  - { label: Visível, name: visible, widget: boolean, default: true }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Texto acima do título, name: eyebrow, widget: string, required: false }
                  - { label: Alinhamento, name: alignment, widget: select, options: [start, center], default: start }
                  - { label: Imagem, name: image, widget: image, choose_url: false }
                  - { label: Texto alternativo, name: alt, widget: string }
                  - { label: Legenda, name: caption, widget: string, required: false }
                  - { label: Ajuste da imagem, name: fit, widget: select, options: [contain, cover], default: contain }
              - label: Vídeo
                name: video
                fields:
                  - { label: Visível, name: visible, widget: boolean, default: true }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Texto acima do título, name: eyebrow, widget: string, required: false }
                  - { label: Alinhamento, name: alignment, widget: select, options: [start, center], default: start }
                  - { label: Plataforma, name: provider, widget: select, options: [youtube, vimeo] }
                  - { label: URL do vídeo, name: url, widget: string, pattern: ["^https?://", "Use uma URL pública." ] }
                  - { label: Legenda, name: caption, widget: string, required: false }
              - label: Chamada para ação
                name: cta
                fields:
                  - { label: Visível, name: visible, widget: boolean, default: true }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Texto acima do título, name: eyebrow, widget: string, required: false }
                  - { label: Alinhamento, name: alignment, widget: select, options: [start, center], default: start }
                  - { label: Texto, name: content, widget: text }
                  - { label: Texto do botão, name: buttonLabel, widget: string }
                  - { label: Link do botão, name: buttonUrl, widget: string, pattern: ["^(?:/|https?://)", "Use um link interno iniciado por / ou uma URL https://." ] }

  - name: about
    label: Perfil do artista
    description: "Atualize a apresentação profissional, currículo e contatos exibidos na página Sobre."
    files:
      - name: about
        label: Perfil e página Sobre
        file: src/data/site/about.md
        fields:
          - { name: type, widget: hidden, default: about }
          - { label: Nome artístico, name: artisticName, widget: string }
          - { label: Título profissional, name: professionalTitle, widget: string }
          - { label: Foto de perfil, name: profileImage, widget: image, required: false, choose_url: false }
          - { label: Biografia curta, name: shortBio, widget: text }
          - { label: Biografia completa, name: fullBio, widget: text, required: false, hint: "Texto corrido. A quebra de linha é preservada na página Sobre." }
          - { label: Formação e cursos, name: education, widget: list, required: false, label_singular: "Formação", summary: "{{fields.title}} · {{fields.year}}", collapsed: true, minimize_collapsed: true, fields: [{ label: Curso, name: title, widget: string }, { label: Instituição, name: institution, widget: string, required: false }, { label: Ano, name: year, widget: string, required: false }] }
          - { label: Experiências e trajetória, name: experience, widget: list, required: false, label_singular: "Experiência", summary: "{{fields.title}} · {{fields.period}}", collapsed: true, minimize_collapsed: true, fields: [{ label: Função ou marco, name: title, widget: string }, { label: Organização, name: organization, widget: string, required: false }, { label: Período, name: period, widget: string, required: false }, { label: Descrição, name: description, widget: text, required: false }] }
          - { label: Especialidades, name: specialties, widget: list, required: false, label_singular: "Especialidade", collapsed: true, minimize_collapsed: true, field: { label: Competência, name: specialty, widget: string } }
          - { label: Links e contato, name: links, widget: list, required: false, label_singular: "Link", summary: "{{fields.label}}", collapsed: true, minimize_collapsed: true, fields: [{ label: Nome, name: label, widget: string }, { label: URL, name: url, widget: string, pattern: ["^https?://", "Use https://"] }] }
          - { label: Currículo em PDF, name: resume, widget: file, required: false, choose_url: false }
          - { label: Visibilidade das seções, name: sections, widget: object, collapsed: true, hint: "Opções avançadas: oculte uma seção sem apagar seus dados.", fields: [{ label: Formação, name: education, widget: boolean, default: true }, { label: Trajetória, name: experience, widget: boolean, default: true }, { label: Especialidades, name: specialties, widget: boolean, default: true }, { label: Links, name: links, widget: boolean, default: true }] }

  - name: appearance
    label: Aparência do site
    description: "Ajuste cores, tipografia e layout. As opções são limitadas a valores seguros para preservar a legibilidade."
    files:
      - name: appearance
        label: Aparência e layout
        file: src/data/site/theme.json
        fields:
          - { name: type, widget: hidden, default: theme }
          - label: Cores e identidade visual
            name: colors
            widget: object
            collapsed: false
            hint: "Escolha no seletor ou digite #RRGGBB. Combinações sem contraste mínimo são recusadas no salvamento."
            fields:
              - { label: Fundo, name: background, widget: color, allowInput: true }
              - { label: Superfície, name: surface, widget: color, allowInput: true }
              - { label: Texto, name: text, widget: color, allowInput: true }
              - { label: Texto secundário, name: mutedText, widget: color, allowInput: true }
              - { label: Títulos, name: heading, widget: color, allowInput: true }
              - { label: Links, name: link, widget: color, allowInput: true }
              - { label: Bordas, name: border, widget: color, allowInput: true }
              - { label: Botões, name: button, widget: color, allowInput: true }
              - { label: Destaques, name: accent, widget: color, allowInput: true }
          - label: Tipografia
            name: typography
            widget: object
            collapsed: true
            hint: "Opções avançadas para títulos, corpo e legendas."
            fields:
              - { label: Títulos de projetos, name: hero, widget: object, fields: [{ label: Família, name: family, widget: select, options: [sans, serif, mono] }, { label: Tamanho, name: size, widget: number, min: 24, max: 112 }, { label: Peso, name: weight, widget: number, min: 300, max: 800 }, { label: Entrelinha, name: lineHeight, widget: number, min: 0.9, max: 2, value_type: float }, { label: Espaçamento entre letras, name: letterSpacing, widget: number, min: -0.1, max: 0.2, value_type: float }] }
              - { label: Títulos de seção, name: section, widget: object, fields: [{ label: Família, name: family, widget: select, options: [sans, serif, mono] }, { label: Tamanho, name: size, widget: number, min: 20, max: 72 }, { label: Peso, name: weight, widget: number, min: 300, max: 800 }, { label: Entrelinha, name: lineHeight, widget: number, min: 0.9, max: 2, value_type: float }, { label: Espaçamento entre letras, name: letterSpacing, widget: number, min: -0.1, max: 0.2, value_type: float }] }
              - { label: Texto corrido, name: body, widget: object, fields: [{ label: Família, name: family, widget: select, options: [sans, serif, mono] }, { label: Tamanho, name: size, widget: number, min: 14, max: 28 }, { label: Peso, name: weight, widget: number, min: 300, max: 800 }, { label: Entrelinha, name: lineHeight, widget: number, min: 1, max: 2, value_type: float }, { label: Espaçamento entre letras, name: letterSpacing, widget: number, min: -0.1, max: 0.2, value_type: float }] }
              - { label: Legendas, name: caption, widget: object, fields: [{ label: Família, name: family, widget: select, options: [sans, serif, mono] }, { label: Tamanho, name: size, widget: number, min: 12, max: 20 }, { label: Peso, name: weight, widget: number, min: 300, max: 800 }, { label: Entrelinha, name: lineHeight, widget: number, min: 1, max: 2, value_type: float }, { label: Espaçamento entre letras, name: letterSpacing, widget: number, min: -0.1, max: 0.2, value_type: float }] }
          - label: Layout da galeria
            name: layout
            widget: object
            collapsed: true
            hint: "Defina a densidade e a grade do portfólio. No tablet são usadas no máximo 2 colunas; no celular, a opção escolhida abaixo."
            fields:
              - { label: Largura máxima, name: container, widget: number, min: 960, max: 1600 }
              - { label: Colunas no desktop, name: columns, widget: select, options: [{ label: "1 coluna", value: 1 }, { label: "2 colunas", value: 2 }, { label: "3 colunas (recomendado)", value: 3 }, { label: "4 colunas", value: 4 }], hint: "No tablet a grade reduz automaticamente para até 2 colunas." }
              - { label: Colunas no celular, name: mobileColumns, widget: select, options: [{ label: "1 coluna (recomendado)", value: 1 }, { label: "2 colunas", value: 2 }], hint: "Use 2 apenas quando as obras continuarem legíveis em telas estreitas." }
              - { label: Proporção das miniaturas, name: thumbnailRatio, widget: select, options: [{ label: "Original / automática", value: original }, { label: "Quadrada — 1:1", value: square }, { label: "Horizontal — 16:9", value: wide }], hint: "A opção original preserva a proporção da obra. As proporções fixas usam recorte visual, sem alterar o arquivo enviado." }
              - { label: Espaçamento da galeria, name: density, widget: select, options: [{ label: "Compacto", value: compact }, { label: "Confortável (recomendado)", value: comfortable }], hint: "Ajusta gutters, espaçamento entre obras e área de texto dos cartões." }
              - { label: Espaço base entre cards, name: cardGap, widget: number, min: 12, max: 48, hint: "A densidade aplica um ajuste seguro sobre este valor." }
              - { label: Espaço base entre seções, name: sectionGap, widget: number, min: 48, max: 160 }
              - { label: Margem lateral base, name: gutter, widget: number, min: 16, max: 64 }
          - { label: Bordas e sombras, name: components, widget: object, collapsed: true, fields: [{ label: Raio dos cantos, name: radius, widget: number, min: 0, max: 40 }, { label: Espessura das bordas, name: borderWidth, widget: number, min: 0, max: 3 }, { label: Sombra, name: shadow, widget: select, options: [none, soft, strong] }] }
          - { label: Layout da página Sobre, name: aboutLayout, widget: object, collapsed: true, fields: [{ label: Largura do texto, name: contentWidth, widget: number, min: 560, max: 960 }, { label: Tamanho do retrato, name: portraitSize, widget: number, min: 96, max: 320 }] }
          - { label: Mostrar link de contato no topo, name: showContactLink, widget: boolean, default: true }
          - { label: Mostrar rodapé, name: showFooter, widget: boolean, default: true }
          - { label: Texto do rodapé, name: footerText, widget: string, required: false }
          - { label: Links do rodapé, name: footerLinks, widget: list, required: false, label_singular: "Link do rodapé", summary: "{{fields.label}}", collapsed: true, minimize_collapsed: true, fields: [{ label: Nome, name: label, widget: string }, { label: URL, name: url, widget: string, pattern: ["^https?://", "Use https://"] }] }
